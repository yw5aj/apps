<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小工具</title>
<meta name="theme-color" content="#eaf1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a26" media="(prefers-color-scheme: dark)">
<style>
/* Layout: a left-aligned shelf. Each app is one full-width row with its own icon; rows are
   separated by hairlines so the page looks finished with one app or with twenty. */
@font-face {
  font-family: "XiaoWei";
  src: url("assets/xiaowei-title.woff2") format("woff2");
  font-display: swap;
}
:root {
  --yuebai: #eaf1f4;  /* 月白 page ground */
  --dai: #1f2a3c;     /* 黛 ink */
  --muted: #5a687b;
  --line: #c6d4db;
  --tile: #dbe6eb;    /* icon fallback tile */
  --font-display: "XiaoWei", "Noto Serif CJK SC", "Songti SC", serif;
  --font-body: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --yuebai: #131a26; --dai: #e3eef2; --muted: #93a3b5; --line: #303d51; --tile: #222d3e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--yuebai); color: var(--dai); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
main { max-width: 560px; margin: 0 auto; padding: 56px 20px 64px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 56px; line-height: 1.1; letter-spacing: 0; margin: 0 0 6px; }
.lede { margin: 0 0 36px; color: var(--muted); }
#list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
#list li { border-bottom: 1px solid var(--line); }
a.app { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; padding: 18px 0; text-decoration: none; color: inherit; }
a.app:focus-visible { outline: 3px solid var(--dai); outline-offset: 4px; border-radius: 8px; }
.icon { width: 64px; height: 64px; border-radius: 18px; background: var(--tile); display: grid; place-items: center; font-size: 30px; overflow: hidden; }
.icon img { width: 100%; height: 100%; display: block; }
.name { font-size: 20px; font-weight: 600; line-height: 1.3; }
.desc { color: var(--muted); font-size: 15px; }
@media (hover: hover) { a.app:hover .name { text-decoration: underline; text-underline-offset: 4px; } }
#empty { color: var(--muted); padding: 18px 0; }
a.apk { display: inline-flex; align-items: center; min-height: 44px; margin: -10px 0 8px 80px; color: var(--yanzhi); font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
a.apk:focus-visible { outline: 3px solid var(--dai); outline-offset: 3px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>小工具</h1>
  <p class="lede">做给家里人用的几个小东西。</p>
  <ul id="list"></ul>
  <p id="empty" hidden>还没有 app。</p>
</main>
<script>
  fetch('apps.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(apps => {
      const list = document.getElementById('list');
      if (!Array.isArray(apps) || apps.length === 0) {
        list.hidden = true;
        document.getElementById('empty').hidden = false;
        return;
      }
      for (const app of apps) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'app';
        // "web": false means the app only exists as an Android APK.
        a.href = app.web === false && app.apk ? app.apk : encodeURIComponent(app.path) + '/';
        const icon = document.createElement('span');
        icon.className = 'icon';
        if (app.icon) {
          const img = document.createElement('img');
          img.src = app.icon; img.alt = '';
          img.onerror = () => { icon.textContent = app.emoji || '📦'; };
          icon.appendChild(img);
        } else {
          icon.textContent = app.emoji || '📦';
        }
        const text = document.createElement('span');
        const name = document.createElement('div');
        name.className = 'name'; name.textContent = app.name || app.path;
        text.appendChild(name);
        if (app.desc) {
          const desc = document.createElement('div');
          desc.className = 'desc'; desc.textContent = app.desc;
          text.appendChild(desc);
        }
        a.appendChild(icon); a.appendChild(text);
        li.appendChild(a);
        if (app.apk && app.web !== false) {
          const apk = document.createElement('a');
          apk.className = 'apk'; apk.href = app.apk;
          apk.textContent = '下载安卓版（转换时可以切走）';
          li.appendChild(apk);
        }
        list.appendChild(li);
      }
    });
</script>
</body>
</html>
